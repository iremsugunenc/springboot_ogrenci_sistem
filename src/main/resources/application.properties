
spring.application.name=ogrenci-yonetim-sistemi

spring.datasource.url=jdbc:h2:mem:ogrencidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoint ayarlari
management.endpoints.web.exposure.include=health,info,metrics

# Health detaylari
management.endpoint.health.show-details=always

# Uygulama bilgileri
management.info.env.enabled=true
info.app.name=Ogrenci Yonetim Sistemi
info.app.description=Spring Boot ile ogrenci yonetim uygulamasi
info.app.version=1.0.0